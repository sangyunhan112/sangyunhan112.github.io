# Configurations
title:            Sangyun's Personal Blog
longtitle:        Sangyun's Personal Blog
author:           Sangyun Han
email:            syunhan@mit.edu
description: >
  Sangyun's Personal Blog

version:          1.0
gitbook_version:  3.2.3

url:              "https://sangyunhan112.github.io"
baseurl:          ""
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min:   1
  h_max:   3

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:year-:month-:day-:title:output_ext

# Disqus comments
# disqushandler:            sighingnow

exclude:
  - _drafts

collections:
  general:
    output: true
    sort_by: date
    permalink: /:collection/:path/
  bio:
    output: true
    sort_by: date
    permalink: /:collection/:path/
  pages:
    output: true
    sort_by: date
    permalink: /:collection/:path/
  others:
    output: true
    sord_by: date
    permalink: /:collection/:path/

ordered_collections:
  - general
  - bio
  - pages
  - others

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
